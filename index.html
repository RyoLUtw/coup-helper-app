<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coup English Helper</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <button class="icon-button back-button hidden" type="button" aria-label="Go back">
          <span aria-hidden="true">&larr;</span>
        </button>
        <div>
          <p class="eyebrow">Classroom Coup</p>
          <h1>Coup English Helper</h1>
        </div>
        <button class="icon-button settings-button" type="button" aria-label="Open settings">
          <span aria-hidden="true">&#9881;</span>
        </button>
      </header>

      <main id="app" class="screen" aria-live="polite"></main>
    </div>

    <dialog id="line-modal" class="modal">
      <div class="modal-panel">
        <div class="modal-header">
          <div>
            <p id="modal-kicker" class="eyebrow"></p>
            <h2 id="modal-title"></h2>
          </div>
          <button class="icon-button close-modal" type="button" aria-label="Close dialog">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div id="modal-content" class="modal-content"></div>
      </div>
    </dialog>

    <dialog id="settings-modal" class="modal">
      <div class="modal-panel settings-panel">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Settings</p>
            <h2>Practice Mode</h2>
          </div>
          <button class="icon-button close-settings" type="button" aria-label="Close settings">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="settings-content">
          <label class="toggle-row">
            <span>
              <strong>Test mode</strong>
              <small>Useful vocabulary appears as first-letter blanks.</small>
            </span>
            <input id="test-mode" type="checkbox" role="switch">
          </label>
          <label class="toggle-row">
            <span>
              <strong>Show Chinese character name</strong>
              <small>Adds Traditional Chinese names after character names.</small>
            </span>
            <input id="show-chinese" type="checkbox" role="switch">
          </label>
          <label class="toggle-row">
            <span>
              <strong>Show vocabulary translation</strong>
              <small>Adds Traditional Chinese translations after useful vocabulary.</small>
            </span>
            <input id="show-vocab-translation" type="checkbox" role="switch">
          </label>
          <details class="settings-section voice-layer-section">
            <summary>
              <span>
                <span class="eyebrow" id="voice-layer-settings">Voice Line Layers</span>
                <small>Choose which interaction layers show practice lines.</small>
              </span>
            </summary>
            <div class="voice-layer-tools" aria-label="Voice line layer bulk actions">
              <button class="secondary-button" type="button" data-voice-layer-select="all">Select all</button>
              <button class="secondary-button" type="button" data-voice-layer-select="none">Deselect all</button>
            </div>
            <div id="voice-layer-options" class="settings-grid"></div>
          </details>
        </div>
      </div>
    </dialog>

    <dialog id="shared-setup-modal" class="modal compact-modal">
      <div class="modal-panel settings-panel">
        <div class="modal-header">
          <div>
            <p class="eyebrow">Shared Device</p>
            <h2>Players</h2>
          </div>
          <button class="icon-button close-shared-setup" type="button" aria-label="Close setup">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div id="shared-setup-content" class="modal-content"></div>
      </div>
    </dialog>

    <script src="app.js?v=voice-layers-skip-hidden-20260818"></script>
  </body>
</html>
